name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "raihanfaisalyusuf@gmail.com"
          git config --global user.name "RaihanIDN"
          
          # 1. Hapus folder static secara fisik bray
          rm -rf static/
          
          # 2. Pindah ke branch bersih (orphan)
          git checkout --orphan deploy-branch
          
          # 3. PAKSA BUAT ULANG README.md yang valid di baris paling atas khusus untuk Hugging Face
          cat << 'EOF' > README.md
---
title: resepku-golang
emoji: 🍳
colorFrom: green
colorTo: lime
sdk: docker
pinned: false
---

# Resepku - Fullstack Golang & Supabase
Aplikasi portofolio manajemen resep makanan menggunakan bahasa pemrograman Golang dan database Supabase.
EOF

          # 4. Ambil semua berkas (main.go, Dockerfile, templates, dan README.md baru)
          git add .
          git commit -m "Deploy fresh artifact with correct HF metadata"
          
          # 5. Paksa push ke Hugging Face Space
          git remote add hf https://RaihanID:$HF_TOKEN@huggingface.co/spaces/RaihanID/resepku-golang || true
          git push --force hf deploy-branch:main
