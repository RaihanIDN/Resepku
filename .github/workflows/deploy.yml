name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        run: |
          git remote add hf https://RaihanID:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/RaihanID/resepku-golang
          git push --force hf main
