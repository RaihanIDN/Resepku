name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Hapus folder static dan folder .github bawaan agar bersih total
          rm -rf static/
          rm -rf .github/
          
          # 2. Inisialisasi Git baru dari nol (menghapus history biner lama)
          git init
          git config --global user.email "raihanfaisalyusuf@gmail.com"
          git config --global user.name "RaihanIDN"
          
          # 3. Paksa nama branch utamanya menjadi 'main' (biar singkron sama Hugging Face)
          git branch -M main
          
          # 4. Ambil semua file bersih yang tersisa (main.go, Dockerfile, html)
          git add .
          git commit -m "Fresh deploy without binary history"
          
          # 5. Paksa push ke Hugging Face
          git remote add hf https://RaihanID:$HF_TOKEN@huggingface.co/spaces/RaihanID/resepku-golang
          git push --force hf main
