name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "raihanfaisalyusuf@gmail.com"
          git config --global user.name "RaihanIDN"
          
          # 1. Pindah ke branch baru (orphan) agar terisolasi
          git checkout --orphan deploy-branch
          
          # 2. Hapus folder static dan file README dari index Git secara brutal
          git rm -rf static/ --ignore-unmatch || true
          rm -rf static/
          rm -f README.md
          
          # 3. Buat ulang file README.md dengan warna valid Hugging Face (green -> yellow)
          echo "---" > README.md
          echo "title: resepku-golang" >> README.md
          echo "emoji: 🍳" >> README.md
          echo "colorFrom: green" >> README.md
          echo "colorTo: yellow" >> README.md
          echo "sdk: docker" >> README.md
          echo "pinned: false" >> README.md
          echo "---" >> README.md
          echo "" >> README.md
          echo "# Resepku - Fullstack Golang" >> README.md
          
          # 4. Hanya tambahkan berkas teks murni ke antrean
          git add main.go Dockerfile go.mod *.html README.md || git add .
          
          # 5. Commit dengan sejarah baru yang 100% steril dari file .png
          git commit -m "Deploy pure source files with valid HF colors"
          
          # 6. Paksa dorong ke Hugging Face Space
          git remote add hf https://RaihanID:$HF_TOKEN@huggingface.co/spaces/RaihanID/resepku-golang || true
          git push --force hf deploy-branch:main
