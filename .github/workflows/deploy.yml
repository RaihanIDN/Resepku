name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "raihanfaisalyusuf@gmail.com"
          git config --global user.name "RaihanIDN"
          
          # 1. Hapus folder static secara fisik di runner
          rm -rf static/
          
          # 2. Pindah ke branch baru (orphan) agar riwayat biner masa lalu hilang total
          git checkout --orphan deploy-branch
          
          # 3. Hapus README lama di runner (jika ada) biar tidak bentrok
          rm -f README.md
          
          # 4. Buat ulang file README.md dengan struktur metadata khusus Hugging Face Docker
          echo "---" > README.md
          echo "title: resepku-golang" >> README.md
          echo "emoji: 🍳" >> README.md
          echo "colorFrom: green" >> README.md
          echo "colorTo: lime" >> README.md
          echo "sdk: docker" >> README.md
          echo "pinned: false" >> README.md
          echo "---" >> README.md
          echo "" >> README.md
          echo "# Resepku - Fullstack Golang" >> README.md
          
          # 5. Daftarkan semua berkas teks yang tersisa ke antrean git
          git add main.go Dockerfile *.html README.md || git add .
          
          # 6. Commit sebagai lembaran sejarah baru yang bersih
          git commit -m "Deploy fresh artifact with absolute HF metadata"
          
          # 7. Paksa dorong (force push) untuk mereset isi Space di Hugging Face
          git remote add hf https://RaihanID:$HF_TOKEN@huggingface.co/spaces/RaihanID/resepku-golang || true
          git push --force hf deploy-branch:main
