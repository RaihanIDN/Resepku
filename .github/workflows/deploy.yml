name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "raihanfaisalyusuf@gmail.com"
          git config --global user.name "RaihanIDN"
          
          # 1. Hapus folder static secara fisik di lingkungan runner
          rm -rf static/
          
          # 2. Buat branch baru bernama 'deploy-branch' yang terisolasi
          git checkout --orphan deploy-branch
          
          # 3. Masukkan semua file teks bersih yang tersisa (main.go, Dockerfile, html)
          git add .
          
          # 4. Commit sebagai lembaran sejarah baru yang 100% bebas dari file biner (.png)
          git commit -m "Deploy fresh artifact without binary traces"
          
          # 5. Paksa push branch bersih ini untuk menimpa branch 'main' di Hugging Face
          git remote add hf https://RaihanID:$HF_TOKEN@huggingface.co/spaces/RaihanID/resepku-golang || true
          git push --force hf deploy-branch:main
