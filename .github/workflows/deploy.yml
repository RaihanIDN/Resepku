name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Menggunakan token bawaan github agar hak akses clone dijamin 100% lancar
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "raihanfaisalyusuf@gmail.com"
          git config --global user.name "RaihanIDN"
          
          # Hapus file biner dan cache pelacakan LFS lama secara paksa
          git lfs untrack "static/*.png" --allow-empty || true
          rm -f .gitattributes || true
          rm -rf static/
          
          # Commit perubahan agar history bersih dari file biner mentah
          git add .
          git commit -m "Chore: bypass binary and clear git config for HF" || true
          
          # Paksa dorong (force push) ke Hugging Face Space
          git remote add hf https://RaihanID:$HF_TOKEN@huggingface.co/spaces/RaihanID/resepku-golang || true
          git push --force hf main
