<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagikan Resep - Resepku</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .container-add {
            max-width: 600px;
            margin: 120px auto; /* Margin atas gede biar gak ketutup navbar fixed lo */
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .container-add h1 {
            color: #8BC34A;
            margin-bottom: 25px;
            font-weight: 800;
        }
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        .form-group input, .form-group textarea {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
        }
        .btn-submit-resep {
            background-color: #8BC34A;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            font-size: 16px;
        }
        .btn-submit-resep:hover {
            background-color: #388E3C;
        }
        .link-batal {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <div class="logo">Resepku<br></div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/add-recipe" class="active-home">Tambah Resep</a>
            <a href="/Simpan-Makanan">Simpan Makanan</a>
            <a href="/favorit">Favorit Resepku</a>
            <div id="navSearchBtn" class="btn-cari-nav" onclick="window.location.href='/'">Cari</div>
        </div>
    </div>

    <div class="container-add">
        <h1>Bagi Resep Baru</h1>
        <form action="/add-recipe" method="POST">
            <div class="form-group">
                <label>Nama Masakan</label>
                <input type="text" name="title" placeholder="Contoh: Ayam Goreng Serundeng" required>
            </div>

            <div class="form-group">
                <label>Link URL Foto Masakan</label>
                <input type="text" name="image_url" placeholder="Contoh: https://domain.com/gambar-ayam.png (Kosongkan jika ingin pakai default)">
            </div>

            <div class="form-group">
                <label>Deskripsi Singkat</label>
                <textarea name="desc" rows="3" placeholder="Jelaskan sedikit tentang masakan ini..." required></textarea>
            </div>

            <div class="form-group">
                <label>Estimasi Waktu</label>
                <input type="text" name="time" placeholder="Contoh: 45 Menit" required>
            </div>

            <div class="form-group">
                <label>Bahan-Bahan</label>
                <textarea name="bahan" rows="5" placeholder="Tuliskan bahan-bahan di sini..." required></textarea>
            </div>

            <div class="form-group">
                <label>Cara Memasak</label>
                <textarea name="langkah" rows="6" placeholder="Tuliskan langkah-langkah memasaknya..." required></textarea>
            </div>

            <hr style="margin-bottom: 20px; border: 0; border-top: 1px solid #eee;">
            <p style="margin-bottom: 15px; font-weight: 800; color: #8BC34A;">Detail Penyimpanan</p>

            <div class="form-group">
                <label>Simpan Dalam</label>
                <input type="text" name="simpan_dalam" placeholder="Contoh: Wadah Kedap Udara">
            </div>

            <div class="form-group">
                <label>Masa Simpan</label>
                <input type="text" name="masa_simpan" placeholder="Contoh: 1 Bulan">
            </div>

            <div class="form-group">
                <label>Tempat Simpan</label>
                <input type="text" name="tempat_simpan" placeholder="Contoh: Suhu Ruang">
            </div>

            <div class="form-group">
                <label>Kualitas Maksimal</label>
                <input type="text" name="kualitas_maksimal" placeholder="Contoh: Jauhkan dari sinar matahari">
            </div>

            <button type="submit" class="btn-submit-resep">Simpan & Publikasikan</button>
            <a href="/" class="link-batal">Kembali ke Beranda</a>
        </form>
    </div>

</body>
</html>
